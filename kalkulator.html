    <section class="kalkulator" id="kalkulator">
        <h2>Kalkulator Dampak Lingkungan</h2>
        <form id="form-kalkulator">
            <label>Jumlah Tambang Aktif:</label>
            <input type="number" id="jumlah-tambang" min="1" required>
            <label>Kerusakan per Bulan (hektar):</label>
            <input type="number" id="kerusakan-bulan" min="1" required>
            <label>Durasi (tahun):</label>
            <input type="number" id="durasi-tahun" min="1" required>
            <button type="submit" class="btn-primary">Hitung Dampak</button>
        </form>
        <div id="hasil-kalkulator" class="kalkulator-hasil"></div>
    </section>
